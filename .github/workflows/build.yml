name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and publish self-contained EXE
        shell: pwsh
        run: |
          ./scripts/publish.ps1
          $hash = (Get-FileHash dist/win-x64/Glance.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Glance.exe" | Set-Content dist/win-x64/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Glance-win-x64
          path: |
            dist/win-x64/Glance.exe
            dist/win-x64/SHA256SUMS.txt
          if-no-files-found: error
